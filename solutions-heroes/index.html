<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alterion hero embeds: test page</title>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0a0b0a;color:#b3b5b0;font:15px/1.5 "Host Grotesk",sans-serif;padding:32px 16px}h1{color:#f4efe8;font-weight:400;margin:0 0 4px}
.ah-row{display:flex;flex-wrap:wrap;gap:16px;margin:28px 0 8px}.ah-row h2{width:100%;margin:0;font:500 12px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#d24a2f}
.ah-desk{flex:1 1 520px;max-width:760px}.ah-mob{flex:0 0 358px}</style></head><body>
<h1>Alterion hero embeds</h1><p>Each hero is loaded from its own file exactly as Webflow will load it. Left: desktop frame. Right: 358px phone frame.</p>
<div class="ah-row"><h2>shadow-agents</h2><div class="ah-desk"><div data-alterion-hero="shadow-agents" style="aspect-ratio:5/4;width:100%"></div></div><div class="ah-mob"><div data-alterion-hero="shadow-agents" style="aspect-ratio:5/4;width:100%"></div></div></div>
<div class="ah-row"><h2>endpoints</h2><div class="ah-desk"><div data-alterion-hero="endpoints" style="aspect-ratio:5/4;width:100%"></div></div><div class="ah-mob"><div data-alterion-hero="endpoints" style="aspect-ratio:5/4;width:100%"></div></div></div>
<div class="ah-row"><h2>agent-estate</h2><div class="ah-desk"><div data-alterion-hero="agent-estate" style="aspect-ratio:5/4;width:100%"></div></div><div class="ah-mob"><div data-alterion-hero="agent-estate" style="aspect-ratio:5/4;width:100%"></div></div></div>
<div class="ah-row"><h2>agent-drift</h2><div class="ah-desk"><div data-alterion-hero="agent-drift" style="aspect-ratio:5/4;width:100%"></div></div><div class="ah-mob"><div data-alterion-hero="agent-drift" style="aspect-ratio:5/4;width:100%"></div></div></div>
<div class="ah-row"><h2>risk-compliance</h2><div class="ah-desk"><div data-alterion-hero="risk-compliance" style="aspect-ratio:5/4;width:100%"></div></div><div class="ah-mob"><div data-alterion-hero="risk-compliance" style="aspect-ratio:5/4;width:100%"></div></div></div>
<div class="ah-row"><h2>agent-cost</h2><div class="ah-desk"><div data-alterion-hero="agent-cost" style="aspect-ratio:5/4;width:100%"></div></div><div class="ah-mob"><div data-alterion-hero="agent-cost" style="aspect-ratio:5/4;width:100%"></div></div></div>
<script src="shadow-agents.js"></script>
<script src="endpoints.js"></script>
<script src="agent-estate.js"></script>
<script src="agent-drift.js"></script>
<script src="risk-compliance.js"></script>
<script src="agent-cost.js"></script>
</body></html>
